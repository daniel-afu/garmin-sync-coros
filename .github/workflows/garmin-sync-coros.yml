name: garmin-sync-coros

on:
  workflow_dispatch:
  schedule:
    # 每天 01:00 / 08:00 / 21:00 UTC（北京时间 09:00 / 16:00 / 05:00）
    # 注意：原来是 '0 1,8,21 * * ?'，'?' 是 Quartz 写法，GitHub 不认，已改掉
    - cron: '0 1,8,21 * * *'

env:
  GITHUB_NAME: daniel-afu
  GITHUB_EMAIL: 18616022157@163.com

  ## 佳明配置
  GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  GARMIN_NEWEST_NUM: ${{ secrets.GARMIN_NEWEST_NUM }}

  ## Coros配置
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}

  ## 只同步最近多少天内的活动（0 ＝ 不限，默认 30）
  SYNC_DAYS: '30'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Garmin Sync (direct FIT upload)
        run: |
          python scripts/garmin/garmin_sync_coros.py

      - name: Push new cookie
        run: |
          git config --local user.email "${{ env.GITHUB_EMAIL }}"
          git config --local user.name "${{ env.GITHUB_NAME }}"
          git add .
          git commit -m 'update garmin activity' || echo "nothing to commit"
          git push || echo "nothing to push"
